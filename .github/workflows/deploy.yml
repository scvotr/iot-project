name: Deploy Fullstack App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
    # 1. Скачиваем свежий код из вашего репозитория
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Настраиваем актуальное Node.js окружение (Node 24)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    # 3. Собираем React-фронтенд через Vite в папку fr/dist
    - name: Build Frontend
      run: |
        cd fr
        npm install
        npm run build

    # 4. Копируем файлы собранного фронтенда (fr/dist) и бэкенда (bk) на сервер во временную папку
    - name: Copy files via SSH
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "fr/dist/**,bk/**"
        target: "/root/iot-pipeline-temp"

    # 5. Подключаемся к вашей корпоративной ВМ по SSH, раскладываем файлы в целевые папки и обновляем процессы
    - name: Execute remote SSH commands
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # ➔ 1. Обновляем фронтенд в целевой папке Nginx
          # Замените /var/www/my-project/frontend на реальный путь из вашего конфига Nginx
          mkdir -p /var/www/my-project/frontend
          rm -rf /var/www/my-project/frontend/*
          cp -r /root/iot-pipeline-temp/fr/dist/* /var/www/my-project/frontend/
          
          # ➔ 2. Обновляем бэкенд в целевой папке (исключая локальную базу данных *.db и node_modules)
          mkdir -p /var/www/my-project/backend
          rsync -av --exclude='node_modules' --exclude='*.db' /root/iot-pipeline-temp/bk/ /var/www/my-project/backend/
          
          # ➔ 3. Очищаем временную папку сборщика, чтобы не занимать место на ВМ
          rm -rf /root/iot-pipeline-temp
          
          # ➔ 4. Переходим в папку продакшен-бэкенда, доустанавливаем новые либы и перезапускаем PM2
          cd /var/www/my-project/backend
          npm install
          pm2 restart iot-backend || pm2 start server.js --name "iot-backend"
          pm2 save
